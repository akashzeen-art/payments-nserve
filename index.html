<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payments. Nserve — Launching Soon</title>
    <meta
      name="description"
      content="Payments. Nserve — revealing new payments solutions, everyday."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="is-loading">
    <!-- Preloader: Ready → 3 → 2 → 1 -->
    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="demo">
        <div class="demo__colored-blocks">
          <div class="demo__colored-blocks-rotater">
            <div class="demo__colored-block"></div>
            <div class="demo__colored-block"></div>
            <div class="demo__colored-block"></div>
          </div>
          <div class="demo__colored-blocks-inner"></div>
          <div class="demo__text">Ready</div>
        </div>
        <div class="demo__inner">
          <svg class="demo__numbers" viewBox="0 0 100 100">
            <defs>
              <path class="demo__num-path-1" d="M40,28 55,22 55,78" />
              <path
                class="demo__num-join-1-2"
                d="M55,78 55,83 a17,17 0 1,0 34,0 a20,10 0 0,0 -20,-10"
              />
              <path
                class="demo__num-path-2"
                d="M69,73 l-35,0 l30,-30 a16,16 0 0,0 -22.6,-22.6 l-7,7"
              />
              <path class="demo__num-join-2-3" d="M28,69 Q25,44 34.4,27.4" />
              <path
                class="demo__num-path-3"
                d="M30,20 60,20 40,50 a18,15 0 1,1 -12,19"
              />
            </defs>
            <path
              class="demo__numbers-path"
              d="M-10,20 60,20 40,50 a18,15 0 1,1 -12,19
               Q25,44 34.4,27.4
               l7,-7 a16,16 0 0,1 22.6,22.6 l-30,30 l35,0 L69,73
               a20,10 0 0,1 20,10 a17,17 0 0,1 -34,0 L55,83
               l0,-61 L40,28"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Cinematic 3D cube background -->
    <div class="scene" aria-hidden="true">
      <div class="scene__frame" id="scene-frame">
        <div class="container-full">
          <div class="animated hue"></div>
          <img
            class="backgroundImage"
            src="https://drive.google.com/thumbnail?id=1_ZMV_LcmUXLsRokuz6WXGyN9zVCGfAHp&sz=w1920"
            alt=""
          />
          <img
            class="boyImage"
            src="https://drive.google.com/thumbnail?id=1eGqJskQQgBJ67myGekmo4YfIVI3lfDTm&sz=w1920"
            alt=""
          />
          <div class="cube-wrap">
            <div class="cube">
              <div class="face top"></div>
              <div class="face bottom"></div>
              <div class="face left text"></div>
              <div class="face right text"></div>
              <div class="face front"></div>
              <div class="face back text"></div>
            </div>
          </div>
          <div class="container-reflect">
            <div class="cube">
              <div class="face top"></div>
              <div class="face bottom"></div>
              <div class="face left text"></div>
              <div class="face right text"></div>
              <div class="face front"></div>
              <div class="face back text"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="scene__veil"></div>
    </div>

    <main class="stage">
      <p class="brand">Payments.<span>Nserve</span></p>
      <h1 class="launch launch--blink" id="countdown" aria-live="polite">
        Launching in
        <span class="launch__time">
          <span data-unit="hours">22</span>
          hours
        </span>
      </h1>
      <p class="lede">Revealing New Payments Solutions, Everyday!</p>
      <form class="notify" id="notify-form" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Get notified at launch"
          autocomplete="email"
          required
        />
        <button type="submit">Notify me</button>
      </form>
      <p class="form-note" id="form-note" hidden>
        You’re on the list. See you at launch.
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
